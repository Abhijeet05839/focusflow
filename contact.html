<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow - Contact</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>



    <section class="section1">
      <nav>
        <a href="index.html" class="s1logo">
          <!-- <div class="logo-icon">F</div> -->
          <img src="Images/logo.webp" alt="" width="180px" />
        </a>

        <ul class="s1pages">
          <li>
            <a href="#">Features &nbsp; <span class="arrow">↓</span></a>
          </li>
          <li>
            <a href="#">Use Cases &nbsp;<span class="arrow">↓</span></a>
          </li>
          <li><a href="pricing.html">Pricing</a></li>
          <li><a href="updates.html">Updates</a></li>
          <li>
            <a href="contact.html">Contact &nbsp;<span class="arrow">↓</span></a>
          </li>
        </ul>

        <div class="login-pages">
          <a href="signup.html"><button class="signin-button">Sign in</button></a>
          <a href="signup.html"><button class="signup-button">Sign up</button></a>
        </div>
      </nav>


    
    <div class="container">
        <div class="form-box">
            <form action="">
                <h1>Get in touch</h1>
                <p>Our friendly team would love to hear from you!</p>
                <div class="name">
                <div class="input-box input-box1">
                    <label for="firstName">First name</label><br>
                    <input id="firstName" type="text" placeholder="First name">
                </div>
                <div class="input-box input-box1">
                    <label for="lastName">Last name</label><br>
                    <input id="lastName" type="text" placeholder="Last name">
                </div>
                </div>
                <div class="input-box">
                    <label for="email">Email</label>
                    <input id="email" type="text" placeholder="you@company.com">
                </div>
                <div class="input-box">
                    <label for="phone">Phone number</label>
                    <div class="input-box2">
                    <select name="cc" id="countryCode">
                        <option value="us">US</option>
                        <option value="aus">AUS</option>
                        <option value="in">IN</option>
                        <option value="ca">CA</option>
                        <option value="uk">UK</option>
                    </select>
                    <input id="phone" type="text" placeholder="+1 (555) 000-0000"> 
                    </div>
                </div>
                <div class="input-box">
                    <label for="message">Message</label>
                    <textarea rows="5" name="message" id="message"></textarea>
                </div>
                <div>
                    <input type="checkbox" name="" id="privacy-polciy">
                    <label for="privacy-polciy">You agree to our friendly <u>privacy policy</u>.</label>
                </div>
                <button type="submit" class="btn">Send message</button>
            </form>
        </div>
        <div class="image-box">
            <img src="Images/contact.webp" alt="">
        </div>
    </div>
    </section>
</body>
</html>
